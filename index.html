<script>

    




// =========================================
// THEME TOGGLE
// =========================================

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("theme");


// =========================================
// APPLY SAVED THEME
// =========================================

if (savedTheme === "dark") {

    document.body.classList.add(
        "dark-theme"
    );

}


// =========================================
// THEME BUTTON
// =========================================

if (themeToggle) {

    themeToggle.addEventListener(
        "click",
        () => {

            document.body.classList.toggle(
                "dark-theme"
            );


            const isDark =
                document.body.classList.contains(
                    "dark-theme"
                );


            localStorage.setItem(
                "theme",
                isDark
                    ? "dark"
                    : "light"
            );

        }
    );

}

    lucide.createIcons();

</script>
