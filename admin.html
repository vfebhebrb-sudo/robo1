<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پنل مدیریت</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

<style>

/* =====================================
   ADMIN SYSTEM VARIABLES
===================================== */


:root{

    --background:#111315;

    --surface:#191c21;

    --surface-hover:#22262d;

    --text:#f9fafb;

    --text-secondary:#9ca3af;

    --border:#292e36;


    --accent:#3b82f6;

    --accent-soft:#172554;


    --shadow:
    0 8px 25px rgba(0,0,0,.35);

}





/* =====================================
   RESET
===================================== */


*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:"Vazirmatn",sans-serif;

}



body{


    min-height:100vh;

    background:
    var(--background);

    color:
    var(--text);


    overflow:hidden;

}



/* =====================================
   BACKGROUND EFFECT
===================================== */


body::before{


content:"";


position:fixed;


width:420px;

height:420px;


top:-180px;

right:-180px;


background:

var(--accent);



opacity:.15;


filter:

blur(100px);



border-radius:50%;



animation:

adminGlow 8s infinite alternate;



}




body::after{


content:"";


position:fixed;


width:350px;

height:350px;


bottom:-160px;

left:-120px;


background:

#38bdf8;


opacity:.08;


filter:

blur(100px);


border-radius:50%;



animation:

adminGlow2 10s infinite alternate;


}




/* =====================================
   PAGE
===================================== */


.admin-login-page{


min-height:100vh;


display:flex;


align-items:center;


justify-content:center;



padding:20px;


position:relative;


z-index:2;



}



/* =====================================
   LOGIN CARD
===================================== */


.admin-login-box{


width:

min(100%,420px);



padding:

38px 32px;



background:

var(--surface);



border:

1px solid

var(--border);



border-radius:

26px;



box-shadow:

var(--shadow);



animation:

loginEnter .6s ease;



position:relative;


overflow:hidden;


}




/* نور داخل کارت */


.admin-login-box::before{


content:"";


position:absolute;


width:180px;

height:180px;



top:-90px;

left:-90px;



background:

var(--accent);



opacity:.12;



filter:

blur(50px);



border-radius:50%;


}



/* =====================================
   LOGO
===================================== */


.admin-logo{


width:72px;


height:72px;



margin:

0 auto 22px;



display:flex;


align-items:center;


justify-content:center;



border-radius:

22px;



background:

var(--accent-soft);



color:

var(--accent);



animation:

logoFloat 3s infinite ease-in-out;



}



.admin-logo svg{


width:34px;

height:34px;


}





/* =====================================
   TEXT
===================================== */


.admin-login-box h1{


text-align:center;



font-size:

25px;



font-weight:

800;



color:

var(--text);



}



.admin-login-box p{


text-align:center;



margin:

10px 0 28px;



font-size:

13px;



color:

var(--text-secondary);



}



/* =====================================
   INPUT
===================================== */


.admin-input-box{


height:

56px;



display:flex;


align-items:center;



gap:

12px;



padding:

0 16px;



background:

var(--surface-hover);



border:

1px solid

var(--border);



border-radius:

16px;



transition:.3s;



}




.admin-input-box:focus-within{


border-color:

var(--accent);



box-shadow:

0 0 0 4px

rgba(59,130,246,.15);



}




.admin-input-box svg{


width:20px;



color:

var(--text-secondary);



}



.admin-input-box input{


width:100%;


height:100%;



background:none;



border:0;



outline:none;



color:

var(--text);



font-size:14px;



}




.admin-input-box input::placeholder{


color:

var(--text-secondary);


}




/* =====================================
 ERROR
===================================== */


.admin-login-error{


height:25px;



display:flex;


align-items:center;


justify-content:center;



font-size:13px;



color:#ef4444;



opacity:0;



transition:.3s;



}



.admin-login-error.show{


opacity:1;


animation:

shake .35s;



}



/* =====================================
 BUTTON
===================================== */


.admin-login-btn{


width:100%;



height:52px;



margin-top:8px;



border:0;



border-radius:15px;



background:

var(--accent);



color:white;



display:flex;


align-items:center;


justify-content:center;



gap:8px;



cursor:pointer;



font-size:14px;



font-weight:700;



transition:.3s;



}



.admin-login-btn svg{


width:18px;


}




.admin-login-btn:hover{


transform:

translateY(-3px);



box-shadow:

0 12px 30px

rgba(59,130,246,.35);



}




.admin-login-btn:active{


transform:

scale(.97);


}



/* =====================================
 ANIMATIONS
===================================== */


@keyframes loginEnter{


from{


opacity:0;


transform:

translateY(25px)

scale(.95);



}


to{


opacity:1;


transform:

none;


}


}



@keyframes logoFloat{


0%,100%{


transform:

translateY(0);


}



50%{


transform:

translateY(-7px);


}



}



@keyframes shake{


0%,100%{


transform:

translateX(0);


}


25%{


transform:

translateX(8px);


}


50%{


transform:

translateX(-8px);


}


75%{


transform:

translateX(5px);


}



}




@keyframes adminGlow{


from{


transform:

translate(0,0);


}


to{


transform:

translate(-60px,80px);


}


}



@keyframes adminGlow2{


from{


transform:

translate(0,0);


}


to{


transform:

translate(50px,-50px);


}


}



/* =====================================
 MOBILE
===================================== */


@media(max-width:480px){


.admin-login-box{


padding:

30px 22px;



border-radius:

22px;



}


.admin-login-box h1{


font-size:

22px;


}



.admin-logo{


width:

64px;


height:

64px;


}



}


</style>
</head>


<body>


<body>

<main class="admin-login-page">


<div class="admin-login-box">


<div class="admin-logo">
<i data-lucide="shield-check"></i>
</div>



<h1>
پنل مدیریت
</h1>


<p>
برای ورود به بخش مدیریت رمز را وارد کنید
</p>




<form id="adminLoginForm">



<div class="admin-input-box">

<i data-lucide="lock"></i>

<input
id="adminPassword"
type="password"
placeholder="رمز مدیریت"
>


</div>



<div
id="adminLoginError"
class="admin-login-error">
</div>




<button
class="admin-login-btn"
type="submit">


<i data-lucide="log-in"></i>

<span>
ورود به پنل
</span>


</button>



</form>



</div>


</main>


    <script src="./config.js"></script>

    <script>
        /* =====================================================
   ADMIN LOGIN
===================================================== */

document.addEventListener("DOMContentLoaded", () => {

    const adminLoginForm =
        document.getElementById("adminLoginForm");

    const adminPassword =
        document.getElementById("adminPassword");

    const adminLoginError =
        document.getElementById("adminLoginError");


    // ================================================
    // رمز موقت پنل مدیریت
    // ================================================

    const ADMIN_PASSWORD = "123456789";


    // ================================================
    // ورود
    // ================================================

    adminLoginForm.addEventListener(
        "submit",
        (event) => {

            event.preventDefault();


            const password =
                adminPassword.value.trim();


            // پاک کردن خطای قبلی

            adminLoginError.textContent = "";

            adminLoginError.classList.remove(
                "show"
            );


            // ==========================================
            // بررسی رمز
            // ==========================================

            if (
                password === ADMIN_PASSWORD
            ) {

                // ورود موفق

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );


                // انتقال به پنل

                window.location.href =
                    "./dashboard.html";


                return;
            }


            // ==========================================
            // رمز اشتباه
            // ==========================================

            adminLoginError.textContent =
                "رمز مدیریت اشتباه است";


            adminLoginError.classList.add(
                "show"
            );


            adminPassword.value = "";

            adminPassword.focus();

        }
    );

});
    </script>


    <script>
        lucide.createIcons();
    </script>

</body>

</html>
