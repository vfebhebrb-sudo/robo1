type="button"

</svg>


</button>

                </button> -->

            </div>

        </div>


        <!-- =========================================
             CATEGORY NAVIGATION
        ========================================== -->

        <nav
            class="category-nav"
            aria-label="دسته‌بندی اصلی"
        >

            <div class="category-inner">


                <!-- Lessons -->



                <!-- Exams -->
                <a
                    href="#"
                    class="category-item"
                >

                    <span class="category-icon">

                        <svg
                            viewBox="0 0 24 24"

                            <rect

                <!-- Archive -->
                <a

                    <span class="category-icon">

                <!-- Schedule -->

    <main class="main-content">

<!-- =========================================
     EXAMS SECTION
========================================= -->
<section
    class="exams-section"
    id="examsSection"
>

    <!-- ==============================
         SECTION HEADING
    =============================== -->

    <div
        class="section-heading"
        id="examsSectionHeading"
    >

        <div
            class="section-heading-right"
        >

            <div
                class="section-icon"
                id="examsSectionIcon"
            >

               <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" strokeWidth="10" class="w-12 h-12 text-neutral-30 mx-auto mb-3"><path d="M22 10V15C22 20 20 22 15 22H9C4 22 2 20 2 15V9C2 4 4 2 9 2H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M22 10H18C15 10 14 9 14 6V2L22 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M7 13H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M7 17H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>

            </div>


            <div
                class="section-title"
                id="examsSectionTitle"
            >

                <strong>
                    آزمون‌های برگزار شده
                </strong>

                <span>
                    آزمون‌های اخیر و فعال
                </span>

            </div>

        </div>


        <button
            class="section-more"
            id="examsViewAll"
            type="button"
        >

            مشاهده همه

            <i data-lucide="chevron-left"></i>

        </button>

    </div>


    <!-- ==============================
         EXAMS LIST
    =============================== -->

    <div
        class="exams-list"
        id="exams"
    >

        <!--
            آزمون‌ها توسط JavaScript
            به صورت داینامیک ساخته می‌شوند
        -->

    </div>

</section>
<!-- =========================================
     EXAM DETAILS SECTION
========================================= -->
<section
    class="exam-details-section"
    id="examDetailsSection"
>

    <!-- =====================================
         PARTICIPANTS
    ====================================== -->

    <div
        class="participants-card"
        id="participantsCard"
    >

        <div
            class="details-heading"
            id="participantsHeading"
        >

            <div
                class="details-heading-right"
            >

                <div
                    class="details-icon participants-icon"
                    id="participantsIcon"
                >

                    <i data-lucide="users"></i>

                </div>


                <div
                    class="details-title"
                    id="participantsTitle"
                >

                    <strong>
                        شرکت‌کنندگان
                    </strong>

                    <span>
                        افراد شرکت کرده در آزمون
                    </span>

                </div>

            </div>


            <span
                class="participants-count"
                id="participantsCount"
            >
                ۰ نفر
            </span>

        </div>


        <!-- =================================
             PARTICIPANTS LIST
        ================================== -->

        <div
            class="participants-list"
            id="participantsList"
        >

            <!--
                شرکت‌کنندگان توسط JavaScript
                به صورت داینامیک ساخته می‌شوند
            -->

        </div>


        <!-- =================================
             ALL PARTICIPANTS
        ================================== -->

        <button
            class="participants-more"
            id="participantsMore"
            type="button"
        >

            مشاهده همه شرکت‌کنندگان

            <i data-lucide="chevron-left"></i>

        </button>

    </div>



    <!-- =====================================
         MY RESULT
    ====================================== -->

    <div
        class="my-result-card"
        id="myResultCard"
    >

        <div
            class="details-heading"
            id="resultHeading"
        >

            <div
                class="details-heading-right"
            >

                <div
                    class="details-icon result-icon"
                    id="resultIcon"
                >

                    <i data-lucide="chart-no-axes-combined"></i>

                </div>


                <div
                    class="details-title"
                    id="resultTitle"
                >

                    <strong>
                        نتیجه آزمون من
                    </strong>

                    <span>
                        عملکرد شما در آزمون انتخاب‌شده
                    </span>

                </div>

            </div>


            <span
                class="result-status"
                id="resultStatus"
            >
                -
            </span>

        </div>



        <!-- =================================
             RESULT CONTENT
        ================================== -->

        <div
            class="result-content"
            id="resultContent"
        >


            <!-- =============================
                 SCORE
            ============================== -->

            <div
                class="result-score-box"
                id="resultScoreBox"
            >

                <span
                    class="result-score-label"
                >
                    نمره شما
                </span>


                <div
                    class="result-score"
                    id="resultScore"
                >

                    <strong
                        id="resultScoreValue"
                    >
                        -
                    </strong>

                    <span
                        id="resultScoreTotal"
                    >
                        / -
                    </span>

                </div>


                <span
                    class="result-score-percent"
                    id="resultScorePercent"
                >
                    -
                </span>

            </div>



            <!-- =============================
                 STATS
            ============================== -->

            <div
                class="result-stats"
                id="resultStats"
            >


                <!-- CORRECT -->

                <div
                    class="result-stat"
                    id="resultCorrect"
                >

                    <div
                        class="result-stat-icon correct"
                    >

                        <i data-lucide="check"></i>

                    </div>


                    <div>

                        <strong
                            id="correctCount"
                        >
                            -
                        </strong>

                        <span>
                            درست
                        </span>

                    </div>

                </div>



                <!-- WRONG -->

                <div
                    class="result-stat"
                    id="resultWrong"
                >

                    <div
                        class="result-stat-icon wrong"
                    >

                        <i data-lucide="x"></i>

                    </div>


                    <div>

                        <strong
                            id="wrongCount"
                        >
                            -
                        </strong>

                        <span>
                            غلط
                        </span>

                    </div>

                </div>



                <!-- UNANSWERED -->

                <div
                    class="result-stat"
                    id="resultUnanswered"
                >

                    <div
                        class="result-stat-icon unanswered"
                    >

                        <i data-lucide="circle-help"></i>

                    </div>


                    <div>

                        <strong
                            id="unansweredCount"
                        >
                            -
                        </strong>

                        <span>
                            نزده
                        </span>

                    </div>

                </div>



                <!-- TIME -->

                <div
                    class="result-stat"
                    id="resultTime"
                >

                    <div
                        class="result-stat-icon time"
                    >

                        <i data-lucide="clock-3"></i>

                    </div>


                    <div>

                        <strong
                            id="resultTimeValue"
                        >
                            -
                        </strong>

                        <span>
                            زمان
                        </span>

                    </div>

                </div>


            </div>



            <!-- =============================
                 RANK
            ============================== -->

            <div
                class="result-rank-box"
                id="resultRankBox"
            >

                <div
                    class="rank-info"
                    id="rankInfo"
                >

                    <span>
                        رتبه شما
                    </span>

                    <strong
                        id="userRank"
                    >
                        -
                    </strong>

                </div>


                <div
                    class="rank-divider"
                ></div>


                <div
                    class="rank-info"
                    id="rankTotalInfo"
                >

                    <span>
                        از بین
                    </span>

                    <strong
                        id="rankTotal"
                    >
                        -
                    </strong>

                </div>


                <div
                    class="rank-progress"
                    id="rankProgress"
                >

                    <div
                        class="rank-progress-fill"
                        id="rankProgressFill"
                    ></div>

                </div>

            </div>


        </div>



        <!-- =================================
             RESULT DETAILS
        ================================== -->

        <button
            class="result-more"
            id="resultMore"
            type="button"
        >

            مشاهده جزئیات کامل نتیجه

            <i data-lucide="chevron-left"></i>

        </button>

    </div>

</section>




















    </main>
