<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
مدیریت آزمون ها
</title>


<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003.0/Vazirmatn-font-face.css" rel="stylesheet">


<script src="https://unpkg.com/lucide@latest"></script>


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

min-height:100vh;

background:#101214;

color:white;

font-family:"Vazirmatn",sans-serif;

overflow-x:hidden;

}



.container{

width:100%;

min-height:100vh;

padding:10px;

}




/* =========================
HEADER
========================= */


.exam-admin-header{


background:#181b20;

border:1px solid #292e36;

border-radius:22px;

padding:20px;

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:15px;


}



.exam-header-brand{


display:flex;

align-items:center;

gap:15px;


}



.exam-header-icon{


width:60px;

height:60px;

border-radius:18px;

background:#172554;

color:#60a5fa;

display:flex;

align-items:center;

justify-content:center;


}


.exam-header-icon svg{

width:30px;

}



.exam-header-brand h1{

font-size:22px;

}



.exam-header-brand p{

color:#9ca3af;

font-size:13px;

margin-top:5px;

}




.exam-header-status{


background:#052e16;

color:#4ade80;

padding:10px 15px;

border-radius:14px;

display:flex;

align-items:center;

gap:8px;

font-size:13px;


}



.exam-header-status span{

width:8px;

height:8px;

background:#22c55e;

border-radius:50%;

}






/* =========================
STATS
========================= */


.stats{


display:grid;

grid-template-columns:repeat(4,1fr);

gap:12px;

margin-bottom:15px;


}



.stat-card{


background:#181b20;

border:1px solid #292e36;

border-radius:18px;

padding:16px;

display:flex;

align-items:center;

gap:14px;

transition:.3s;


}



.stat-card:hover{


transform:translateY(-4px);

background:#22262d;


}



.stat-icon{


width:48px;

height:48px;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;


}



.stat-icon svg{

width:24px;

}



.stat-icon.blue{

background:#172554;
color:#60a5fa;

}


.stat-icon.green{

background:#052e16;
color:#4ade80;

}



.stat-icon.purple{

background:#2e1065;
color:#c084fc;

}



.stat-icon.orange{

background:#431407;
color:#fb923c;

}




.stat-card span{

display:block;

color:#9ca3af;

font-size:12px;

}



.stat-card b{

font-size:24px;

display:block;

margin-top:4px;

}






/* =========================
TOOLBAR
========================= */


.exam-toolbar{


background:#181b20;

border:1px solid #292e36;

border-radius:18px;

padding:12px;

display:flex;

gap:10px;

margin-bottom:15px;


}



.search-box{


flex:1;

height:45px;

background:#111315;

border:1px solid #292e36;

border-radius:14px;

display:flex;

align-items:center;

gap:10px;

padding:0 15px;


}



.search-box svg{

color:#3b82f6;

}



.search-box input{


background:none;

border:none;

outline:none;

color:white;

font-family:inherit;

width:100%;


}



.exam-toolbar button{


height:45px;

padding:0 18px;

border:none;

border-radius:14px;

background:#2563eb;

color:white;

display:flex;

align-items:center;

gap:8px;

font-family:inherit;

cursor:pointer;

}





/* =========================
EXAMS AREA
========================= */


.exams-wrapper{


background:#181b20;

border:1px solid #292e36;

border-radius:22px;

padding:18px;


}



.section-title{


display:flex;

align-items:center;

gap:10px;

margin-bottom:18px;

}



.section-title svg{

color:#60a5fa;

}





.exams{


display:grid;

grid-template-columns:
repeat(auto-fill,minmax(280px,1fr));

gap:15px;


}






/* =========================
EXAM CARD
========================= */


.exam-card{


background:#111315;

border:1px solid #292e36;

border-radius:20px;

padding:18px;

position:relative;

overflow:hidden;

transition:.3s;


}



.exam-card::before{


content:"";

position:absolute;

width:100px;

height:100px;

right:-40px;

top:-40px;

background:rgba(59,130,246,.15);

border-radius:50%;


}



.exam-card:hover{


transform:translateY(-6px);

border-color:#3b82f6;


}




.exam-title{


font-size:17px;

font-weight:800;

margin-bottom:15px;


}



.info{


display:grid;

gap:10px;

}



.row{


display:flex;

justify-content:space-between;

padding:10px;

background:#181b20;

border-radius:12px;

font-size:13px;


}



.row span{

color:#9ca3af;

}




.enter-btn{


margin-top:15px;

width:100%;

height:42px;

border:none;

border-radius:14px;

background:#2563eb;

color:white;

font-family:inherit;

cursor:pointer;

display:flex;

justify-content:center;

align-items:center;

gap:8px;

transition:.3s;


}




.enter-btn:hover{


background:#1d4ed8;

transform:scale(.98);


}





.empty{


padding:50px;

text-align:center;

color:#9ca3af;


}



.empty svg{

margin-bottom:15px;

}




@media(max-width:900px){


.stats{

grid-template-columns:repeat(2,1fr);

}


}



@media(max-width:600px){


.exam-admin-header{


flex-direction:column;

align-items:flex-start;

gap:15px;


}



.stats{


grid-template-columns:1fr;

}



.exam-toolbar{


flex-direction:column;

}



}


</style>

</head>


<body>


<div class="container">





<!-- =========================
        HEADER
========================= -->


<header class="exam-admin-header">



<div class="exam-header-brand">


<div class="exam-header-icon">

<i data-lucide="clipboard-list"></i>

</div>



<div>

<h1>
آزمون های ثبت شده
</h1>


<p>
مدیریت و بررسی آزمون های سیستم
</p>


</div>



</div>





<div class="exam-header-status">


<span></span>

سیستم فعال


</div>



</header>









<!-- =========================
        STATS
========================= -->


<section class="stats">





<div class="stat-card">


<div class="stat-icon blue">

<i data-lucide="file-text"></i>

</div>


<div>

<span>
تعداد آزمون
</span>


<b id="totalExams">
0
</b>


</div>


</div>






<div class="stat-card">


<div class="stat-icon green">

<i data-lucide="users"></i>

</div>


<div>

<span>
کل شرکت کنندگان
</span>


<b id="totalUsers">
0
</b>


</div>


</div>






<div class="stat-card">


<div class="stat-icon purple">

<i data-lucide="activity"></i>

</div>


<div>

<span>
آزمون فعال
</span>


<b>
0
</b>


</div>


</div>







<div class="stat-card">


<div class="stat-icon orange">

<i data-lucide="clock"></i>

</div>


<div>

<span>
آخرین بروزرسانی
</span>


<b>
اکنون
</b>


</div>


</div>





</section>









<!-- =========================
        TOOLBAR
========================= -->


<section class="exam-toolbar">


<div class="search-box">


<i data-lucide="search"></i>


<input 
placeholder="جستجوی آزمون..."
>


</div>





<button>


<i data-lucide="filter"></i>

فیلتر


</button>



<button>


<i data-lucide="refresh-cw"></i>

بروزرسانی


</button>



</section>









<!-- =========================
        EXAMS LIST
========================= -->


<section class="exams-wrapper">



<div class="section-title">


<i data-lucide="layers"></i>


<h2>
لیست آزمون ها
</h2>


</div>






<div class="exams" id="exams">


<div class="empty">


<i data-lucide="loader"></i>


درحال دریافت آزمون ها...


</div>



</div>



</section>






</div>






<script src="./config.js"></script>


<script>


async function loadExams(){


try{



const response = await fetch(

`${API_URL}/admin/results/exams`

);



const data = await response.json();



console.log(
"ADMIN EXAMS:",
data
);




const box =
document.getElementById(
"exams"
);




box.innerHTML="";



if(

!data.exams ||

data.exams.length===0

){


box.innerHTML=`

<div class="empty">

هنوز آزمونی ثبت نشده است

</div>

`;

return;


}





let users=0;



data.exams.forEach(exam=>{



users += exam.participants;



box.innerHTML += `



<div class="exam-card">


<div class="exam-title">

${exam.title}

</div>



<div class="info">



<div class="row">

<span>
درس
</span>


<b>
${exam.subject}
</b>

</div>




<div class="row">

<span>
تعداد سوال
</span>


<b>
${exam.questionCount}
</b>

</div>





<div class="row">

<span>
زمان
</span>


<b>
${exam.duration}
دقیقه
</b>

</div>





<div class="row">

<span>
شرکت کننده
</span>


<b>
${exam.participants}
نفر
</b>

</div>




</div>





<button

class="enter-btn"

onclick="
openExam('${exam.examId}')
"

>


<i data-lucide="users"></i>

مشاهده کاربران


</button>



</div>



`;




});





document.getElementById(
"totalExams"
).textContent =
data.exams.length;



document.getElementById(
"totalUsers"
).textContent =
users;




lucide.createIcons();



}



catch(error){


console.error(
"LOAD EXAMS ERROR:",
error
);


document.getElementById(
"exams"
).innerHTML=`

<div class="empty">

خطا در اتصال به سرور

</div>

`;

}


}






function openExam(id){


localStorage.setItem(

"adminSelectedExam",

id

);



window.location.href=
"admin-results.html";


}




loadExams();



</script>



</body>

</html>
