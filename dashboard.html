<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
پنل مدیریت
</title>





<script src="https://unpkg.com/lucide@latest"></script>


<style>
/* ======================================================
   BASE
====================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Vazirmatn",
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    direction:rtl;

}


/* ======================================================
   ROOT
====================================================== */

:root{

    --background:#111315;

    --surface:#191c21;

    --surface-hover:#22262d;

    --text:#f9fafb;

    --text-secondary:#9ca3af;

    --border:#292e36;

    --accent:#3b82f6;

    --accent-soft:#172554;

    --shadow:
        0 8px 25px rgba(0,0,0,.35);

    --success:#22c55e;

    --success-soft:
        rgba(34,197,94,.15);

    --danger:#ef4444;

    --danger-soft:
        rgba(239,68,68,.15);

}


/* ======================================================
   MAIN ADMIN
====================================================== */

.ah-admin{

    width:100%;

    max-width:1400px;

    margin:0 auto;

    padding:16px;

}


/* ======================================================
   HEADER
====================================================== */

.ah-admin-header{

    width:100%;

    min-height:62px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 14px;

    background:
        var(--surface);

    border:1px solid
        var(--border);

    border-radius:12px;

    box-shadow:
        var(--shadow);

}


.ah-admin-brand{

    display:flex;

    align-items:center;

    gap:10px;

}


.ah-admin-brand-icon{

    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--accent-soft);

    color:
        var(--accent);

    border-radius:9px;

}


.ah-admin-brand-icon svg{

    width:19px;
    height:19px;

}


.ah-admin-brand h1{

    margin:0;

    font-size:15px;

    font-weight:800;

}


.ah-admin-brand span{

    display:block;

    margin-top:2px;

    color:
        var(--text-secondary);

    font-size:10px;

}


.ah-admin-header-right{

    display:flex;

    align-items:center;

    gap:8px;

}


.ah-system-status{

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 8px;

    background:
        #14171a;

    border:1px solid
        var(--border);

    border-radius:7px;

    color:
        var(--text-secondary);

    font-size:10px;

}


.ah-live-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:
        var(--success);

    box-shadow:
        0 0 0 3px
        var(--success-soft);

}


.ah-icon-button{

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid
        var(--border);

    border-radius:8px;

    background:
        var(--surface-hover);

    color:
        var(--text-secondary);

    cursor:pointer;

    transition:
        .2s ease;

}


.ah-icon-button:hover{

    color:
        var(--text);

    border-color:
        #3a414c;

}


/* ======================================================
   STATS
====================================================== */

.ah-stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-top:10px;

}


.ah-stat{

    min-height:62px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:9px 11px;

    background:
        var(--surface);

    border:1px solid
        var(--border);

    border-radius:11px;

    box-shadow:
        var(--shadow);

}


.ah-stat-icon{

    width:30px;
    height:30px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        var(--accent-soft);

    color:
        var(--accent);

}


.ah-stat-icon.green{

    background:
        var(--success-soft);

    color:
        var(--success);

}


.ah-stat-icon.purple{

    background:
        rgba(139,92,246,.14);

    color:
        #a78bfa;

}


.ah-stat-icon.blue{

    background:
        var(--accent-soft);

    color:
        #60a5fa;

}


.ah-stat span{

    display:block;

    color:
        var(--text-secondary);

    font-size:9px;

}


.ah-stat strong{

    display:block;

    margin-top:2px;

    color:
        var(--text);

    font-size:15px;

}


/* ======================================================
   MAIN GRID
====================================================== */

.ah-main-grid{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        285px;

    gap:10px;

    margin-top:10px;

    align-items:start;

}


/* ======================================================
   PANELS
====================================================== */

.ah-users-panel,
.ah-activity-panel{

    background:
        var(--surface);

    border:1px solid
        var(--border);

    border-radius:12px;

    box-shadow:
        var(--shadow);

    overflow:hidden;

}


/* ======================================================
   PANEL HEADER
   جدا از بدنه
====================================================== */

.ah-panel-header{

    min-height:54px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 13px;

    background:
        #16191d;

    border-bottom:1px solid
        var(--border);

}


.ah-panel-header h2{

    margin:0;

    color:
        var(--text);

    font-size:12px;

    font-weight:800;

}


.ah-panel-header span{

    display:block;

    margin-top:3px;

    color:
        var(--text-secondary);

    font-size:9px;

}


.ah-panel-count{

    padding:4px 7px;

    background:
        var(--surface-hover);

    border:1px solid
        var(--border);

    border-radius:6px;

    color:
        var(--text-secondary);

    font-size:9px;

}


.ah-panel-count span{

    display:inline;

    margin:0;

    color:
        var(--text);

    font-size:10px;

    font-weight:700;

}


/* ======================================================
   USERS BODY
====================================================== */

.ah-users-list{

    padding:9px;

}


/* ======================================================
   USER CARD
====================================================== */

.ah-user-card{

    min-height:52px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:8px 9px;

    margin-bottom:6px;

    background:
        #15181c;

    border:1px solid
        var(--border);

    border-radius:9px;

    transition:
        .2s ease;

}


.ah-user-card:last-child{

    margin-bottom:0;

}


.ah-user-card:hover{

    background:
        var(--surface-hover);

}


.ah-user-avatar{

    width:30px;
    height:30px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        var(--surface-hover);

    color:
        var(--text-secondary);

}


.ah-user-avatar svg{

    width:15px;
    height:15px;

}


.ah-user-info{

    flex:1;

    min-width:0;

}


.ah-user-name-row{

    display:flex;

    align-items:center;

    gap:6px;

}


.ah-user-name-row strong{

    max-width:180px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:11px;

}


.ah-user-phone{

    display:block;

    margin-top:2px;

    color:
        #737b86;

    font-size:9px;

}


.ah-verify-badge{

    display:inline-flex;

    align-items:center;

    gap:3px;

    padding:2px 5px;

    border-radius:5px;

    font-size:7px;

}


.ah-verify-badge svg{

    width:9px;
    height:9px;

}


.ah-verify-badge.verified{

    background:
        var(--success-soft);

    color:
        var(--success);

}


.ah-verify-badge.pending{

    background:
        rgba(234,179,8,.12);

    color:
        #eab308;

}


.ah-delete-btn{

    width:27px;
    height:27px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:7px;

    background:
        transparent;

    color:
        #6f7782;

    cursor:pointer;

}


.ah-delete-btn:hover{

    color:
        var(--danger);

    background:
        var(--danger-soft);

}


/* ======================================================
   ACTIVITY PANEL
====================================================== */

.ah-activity-panel{

    padding-bottom:9px;
    height: 271px;

}


/* هدر مستقل */

.ah-activity-panel
.ah-panel-header{

    margin-bottom:0;

}


/* ======================================================
   ACTIVITY STATS
====================================================== */

.ah-activity-stat{

    display:flex;

    align-items:center;

    gap:9px;

    margin:8px 9px;

    padding:8px;

    background:
        #15181c;

    border:1px solid
        var(--border);

    border-radius:8px;

}


.ah-activity-icon{

    width:29px;
    height:29px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:7px;

}


.ah-activity-icon svg{

    width:14px;
    height:14px;

}


.ah-activity-stat strong{

    font-size:14px;

}


.ah-activity-stat span{

    margin-right:5px;

    color:
        var(--text-secondary);

    font-size:9px;

}


.ah-activity-stat.online
.ah-activity-icon{

    color:
        var(--success);

    background:
        var(--success-soft);

}


.ah-activity-stat.recent
.ah-activity-icon{

    color:
        #eab308;

    background:
        rgba(234,179,8,.12);

}


.ah-activity-stat.offline
.ah-activity-icon{

    color:
        #8b949e;

    background:
        var(--surface-hover);

}


/* ======================================================
   LAST ACTIVITY
====================================================== */

.ah-last-activity{

    margin:
        11px 9px 0;

    padding-top:
        10px;

    border-top:
        1px solid var(--border);

}


.ah-sub-title{

    margin-bottom:7px;

    color:
        var(--text-secondary);

    font-size:9px;

}


.ah-recent-list{

    display:flex;

    flex-direction:column;

    gap:4px;

}


.ah-activity-user{

    display:flex;

    align-items:center;

    gap:7px;

    padding:7px;

    background:
        #15181c;

    border:1px solid
        #24282f;

    border-radius:7px;

}


.ah-status-dot{

    width:6px;
    height:6px;

    flex-shrink:0;

    border-radius:50%;

}


.ah-status-dot.online{

    background:
        var(--success);

}


.ah-status-dot.recent{

    background:
        #eab308;

}


.ah-status-dot.offline{

    background:
        #6b7280;

}


.ah-activity-user-info{

    min-width:0;

}


.ah-activity-user-info strong{

    display:block;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:9px;

}


.ah-activity-user-info span{

    display:block;

    margin-top:2px;

    color:
        #707985;

    font-size:8px;

}


/* ======================================================
   UPDATE
====================================================== */

.ah-update-time{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:4px;

    margin-top:9px;

    color:
        #626b76;

    font-size:8px;

}


/* ======================================================
   EMPTY
====================================================== */

.ah-empty{

    min-height:150px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:7px;

    color:
        #68717d;

    font-size:10px;

}


.ah-empty svg{

    width:23px;
    height:23px;

}


/* ======================================================
   MOBILE
====================================================== */

@media(max-width:900px){

    .ah-main-grid{

        grid-template-columns:1fr;

    }

    .ah-activity-panel{

        order:-1;

    }

    .ah-stats{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:600px){

    .ah-admin{

        padding:9px;

    }

    .ah-stats{

        gap:7px;

    }

    .ah-main-grid{

        gap:8px;

    }

    .ah-system-status{

        display:none;

    }

    .ah-user-name-row{

        flex-wrap:wrap;

    }

}


















/* ======================================================
   USER ROW
====================================================== */

.ah-user-card{

    width:100%;

    min-width:0;

    display:flex;

    align-items:center;

    gap:12px;

    padding:10px 12px;

    background:#15181c;

    border:1px solid var(--border);

    border-radius:9px;

    box-sizing:border-box;

    overflow:hidden;

    animation:
        ahUserIn .35s ease both;

}


/* ======================================================
   AVATAR
====================================================== */

.ah-user-avatar{

    width:32px;

    height:32px;

    min-width:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:#20242a;

    color:#8b95a3;

}


.ah-user-avatar svg{

    width:16px;

    height:16px;

}


/* ======================================================
   COLUMNS
====================================================== */

.ah-user-column{

    min-width:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    gap:3px;

}


/* عنوان کوچک بالای هر اطلاعات */

.ah-column-label{

    font-size:8px;

    color:#626b76;

    white-space:nowrap;

}


/* مقدار */

.ah-user-column strong,
.ah-user-value{

    min-width:0;

    display:block;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:10px;

    color:var(--text);

}


/* ======================================================
   WIDTHS
====================================================== */

.ah-name-column{

    width:110px;

    min-width:110px;

}


.ah-status-column{

    width:90px;

    min-width:90px;

}


.ah-email-column{

    flex:1;

    min-width:120px;

}


.ah-phone-column{

    width:105px;

    min-width:105px;

}


.ah-chat-column{

    width:105px;

    min-width:105px;

}


/* ======================================================
   VERIFY BADGE
====================================================== */

.ah-verify-badge{

    width:max-content;

    display:flex;

    align-items:center;

    gap:4px;

    padding:3px 6px;

    border-radius:5px;

    font-size:8px;

    white-space:nowrap;

}


.ah-verify-badge svg{

    width:11px;

    height:11px;

}


.ah-verify-badge.verified{

    color:#22c55e;

    background:rgba(34,197,94,.10);

}


.ah-verify-badge.pending{

    color:#eab308;

    background:rgba(234,179,8,.10);

}


/* ======================================================
   ACTION
====================================================== */

.ah-user-actions{

    margin-right:auto;

    flex-shrink:0;

}


.ah-delete-btn{

    width:28px;

    height:28px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid #30272a;

    border-radius:6px;

    background:#1b1719;

    color:#ef4444;

    cursor:pointer;

}


.ah-delete-btn:hover{

    background:rgba(239,68,68,.10);

}


.ah-delete-btn svg{

    width:14px;

    height:14px;

}


/* ======================================================
   ACTIVITY USER
====================================================== */

.ah-activity-user{

    width:100%;

    min-width:0;

    display:flex;

    align-items:center;

    gap:9px;

    padding:9px 10px;

    background:#15181c;

    border:1px solid var(--border);

    border-radius:8px;

    box-sizing:border-box;

}


.ah-activity-user-info{

    min-width:0;

    flex:1;

}


.ah-activity-user-info strong{

    display:block;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:10px;

}


.ah-activity-user-info span{

    display:block;

    margin-top:2px;

    font-size:8px;

    color:#707985;

}


.ah-status-dot{

    width:7px;

    height:7px;

    min-width:7px;

    border-radius:50%;

}


.ah-status-dot.online{

    background:var(--success);

}


.ah-status-dot.recent{

    background:#eab308;

}


.ah-email-column{

    width:300px;

    min-width:300px;

    max-width:300px;

    flex:none;

}
































/* ======================================================
   LAST ACTIVITY SECTION
====================================================== */

.ah-last-activity-section{

    width:100%;

    margin-top:14px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:10px;

    overflow:hidden;

    box-sizing:border-box;

}


/* ======================================================
   HEADER
====================================================== */

.ah-last-activity-header{

    width:100%;

    min-height:48px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:8px 12px;

    border-bottom:1px solid var(--border);

    box-sizing:border-box;

}


.ah-last-activity-title{

    display:flex;

    align-items:center;

    gap:9px;

}


.ah-last-activity-title > i{

    width:17px;

    height:17px;

    color:var(--accent);

}


.ah-last-activity-title div{

    display:flex;

    flex-direction:column;

    gap:2px;

}


.ah-last-activity-title strong{

    font-size:11px;

    color:var(--text);

}


.ah-last-activity-title span{

    font-size:8px;

    color:#68717d;

}


/* ======================================================
   UPDATE TIME
====================================================== */

.ah-last-activity-section
.ah-update-time{

    display:flex;

    align-items:center;

    gap:5px;

    color:#68717d;

    font-size:8px;

}


.ah-last-activity-section
.ah-update-time svg{

    width:12px;

    height:12px;

}


/* ======================================================
   ACTIVITY LIST
====================================================== */

.ah-last-activity-section
.ah-recent-list{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:6px;

    padding:9px;

    box-sizing:border-box;

}





.ah-no-activity{

    width:100%;

    min-height:180px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:15px;


    color:var(--text-secondary);

    background:
    var(--surface);


    border:1px dashed var(--border);

    border-radius:18px;


    animation:
    fadeEmpty .4s ease;

}



.ah-no-activity i{

    width:55px;

    height:55px;

    padding:14px;


    border-radius:50%;


    background:
    var(--surface-hover);


    color:
    var(--text-secondary);


    opacity:.8;


}



.ah-no-activity span{

    font-size:14px;

    font-weight:600;

}



@keyframes fadeEmpty{

    from{

        opacity:0;

        transform:
        translateY(10px);

    }


    to{

        opacity:1;

        transform:
        translateY(0);

    }

}























.ah-panel-header{

    display:flex;

    align-items:center;

    justify-content:space-between;


    padding:12px 14px;

    margin:8px;


    border-radius:12px;

}
</style>

</head>


<body>

<main class="ah-admin">

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="ah-admin-header">

        <div class="ah-admin-brand">

            <div class="ah-admin-brand-icon">
                <i data-lucide="shield-check"></i>
            </div>

            <div>
                <h1>پنل مدیریت</h1>
                <span>مدیریت کاربران و فعالیت سیستم</span>
            </div>

        </div>


        <div class="ah-admin-header-right">

            <div class="ah-system-status">

                <span class="ah-live-dot"></span>

                <span>
                    سیستم آنلاین
                </span>

            </div>


            <button
                class="ah-icon-button"
                id="refreshUsersBtn"
                title="بروزرسانی"
            >
                <i data-lucide="refresh-cw"></i>
            </button>

        </div>

    </header>


    <!-- ==========================================
         QUICK STATS
    =========================================== -->

    <section class="ah-stats">

        <div class="ah-stat">

            <div class="ah-stat-icon">
                <i data-lucide="users"></i>
            </div>

            <div>
                <span>کل کاربران</span>
                <strong id="totalUsers">0</strong>
            </div>

        </div>


        <div class="ah-stat">

            <div class="ah-stat-icon green">
                <i data-lucide="user-check"></i>
            </div>

            <div>
                <span>تأیید شده</span>
                <strong id="verifiedUsers">0</strong>
            </div>

        </div>


        <div class="ah-stat">

            <div class="ah-stat-icon blue">
                <i data-lucide="user-plus"></i>
            </div>

            <div>
                <span>آخرین ثبت‌نام</span>
                <strong id="latestUser">-</strong>
            </div>

        </div>


        <div class="ah-stat">

            <div class="ah-stat-icon purple">
                <i data-lucide="activity"></i>
            </div>

            <div>
                <span>آنلاین</span>
                <strong id="onlineUsers">0</strong>
            </div>

        </div>

    </section>


    <!-- ==========================================
         MAIN GRID
    =========================================== -->

    <section class="ah-main-grid">


        <!-- ======================================
             LEFT : USERS
        ======================================= -->

        <section class="ah-users-panel">


            <div class="ah-panel-header">

                <div>

                    <h2>
                        حساب‌های کاربری
                    </h2>

                    <span id="usersStatus">
                        در حال دریافت اطلاعات...
                    </span>

                </div>


                <div class="ah-panel-count">

                    <span id="usersCount">
                        0
                    </span>

                    کاربر

                </div>

            </div>


            <div
                class="ah-users-list"
                id="adminUsersList"
            ></div>


        </section>



        <!-- ======================================
             RIGHT : ACTIVITY
        ======================================= -->

        <aside class="ah-activity-panel">


            <div class="ah-panel-header">

                <div>

                    <h2>
                        وضعیت کاربران
                    </h2>

                    <span>
                        فعالیت لحظه‌ای
                    </span>

                </div>

                <i
                    data-lucide="activity"
                    class="ah-panel-title-icon"
                ></i>

            </div>


            <!-- ONLINE -->

            <div class="ah-activity-stat online">

                <div class="ah-activity-icon">

                    <i data-lucide="wifi"></i>

                </div>

                <div>

                    <strong id="onlineCount">
                        0
                    </strong>

                    <span>
                        آنلاین
                    </span>

                </div>

            </div>


            <!-- RECENT -->

            <div class="ah-activity-stat recent">

                <div class="ah-activity-icon">

                    <i data-lucide="clock-3"></i>

                </div>

                <div>

                    <strong id="recentCount">
                        0
                    </strong>

                    <span>
                        اخیراً فعال
                    </span>

                </div>

            </div>


            <!-- OFFLINE -->

            <div class="ah-activity-stat offline">

                <div class="ah-activity-icon">

                    <i data-lucide="wifi-off"></i>

                </div>

                <div>

                    <strong id="offlineCount">
                        0
                    </strong>

                    <span>
                        آفلاین
                    </span>

                </div>

            </div>


            <!-- LAST ACTIVITY -->



        </aside>


    </section>


    <!-- ======================================================
     LAST ACTIVITY SECTION
====================================================== -->

<section class="ah-last-activity-section">

    <div class="ah-last-activity-header">

        <div class="ah-last-activity-title">

            <i data-lucide="activity"></i>

            <div>

                <strong>
                    آخرین فعالیت‌ها
                </strong>

                <span>
                    کاربران اخیراً فعال
                </span>

            </div>

        </div>


        <div class="ah-update-time">

            <i data-lucide="refresh-cw"></i>

            <span>
                بروزرسانی خودکار هر ۳۰ ثانیه
            </span>

        </div>

    </div>


    <div
        id="recentActivityList"
        class="ah-recent-list"
    ></div>

</section>

</main>


<script src="./config.js"></script>


<script>



// ======================================================
// ADMIN PANEL
// ======================================================


console.log(
    "ADMIN PANEL LOADED"
);


const ADMIN_API =
    `${API_URL}/admin`;



const totalUsers =
    document.getElementById(
        "totalUsers"
    );


const verifiedUsers =
    document.getElementById(
        "verifiedUsers"
    );


const latestUser =
    document.getElementById(
        "latestUser"
    );


const onlineUsers =
    document.getElementById(
        "onlineUsers"
    );


const usersCount =
    document.getElementById(
        "usersCount"
    );


const usersStatus =
    document.getElementById(
        "usersStatus"
    );


const adminUsersList =
    document.getElementById(
        "adminUsersList"
    );


const onlineCount =
    document.getElementById(
        "onlineCount"
    );


const recentCount =
    document.getElementById(
        "recentCount"
    );


const offlineCount =
    document.getElementById(
        "offlineCount"
    );


const recentActivityList =
    document.getElementById(
        "recentActivityList"
    );


const refreshUsersBtn =
    document.getElementById(
        "refreshUsersBtn"
    );



// ======================================================
// LOAD USERS
// ======================================================

async function loadUsers(){

    try{


        usersStatus.textContent =
            "در حال بروزرسانی...";


        const response =
            await fetch(
                `${ADMIN_API}/users`
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "خطا در دریافت کاربران"
            );

        }


        const users =
            data.users || [];


        renderUsers(
            users
        );


        totalUsers.textContent =
            users.length;


        usersCount.textContent =
            users.length;


        const verified =
            users.filter(
                user =>
                    user.verified
            ).length;


        verifiedUsers.textContent =
            verified;


        if(users.length){

            latestUser.textContent =
                users[0].fullname ||
                users[0].phone ||
                "-";

        }
        else{

            latestUser.textContent =
                "-";

        }


        usersStatus.textContent =
            `${users.length} حساب در سیستم`;


    }
    catch(error){

        console.error(
            "LOAD USERS ERROR:",
            error
        );


        usersStatus.textContent =
            "خطا در دریافت اطلاعات";

    }

}



// ======================================================
// LOAD ACTIVITY
// ======================================================

async function loadActivity(){

    try{


        const response =
            await fetch(
                `${ADMIN_API}/users/activity`
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "خطا در دریافت فعالیت کاربران"
            );

        }


        const stats =
            data.stats || {};


        onlineCount.textContent =
            stats.online || 0;


        recentCount.textContent =
            stats.recent || 0;


        offlineCount.textContent =
            stats.offline || 0;


        onlineUsers.textContent =
            stats.online || 0;


        renderActivityUsers(
            data.users || []
        );


    }
    catch(error){

        console.error(
            "ACTIVITY ERROR:",
            error
        );

    }

}



// ======================================================
// RENDER USERS
// ======================================================
// ======================================================
// RENDER USERS
// ======================================================

function renderUsers(users){

    adminUsersList.innerHTML = "";

    if(!users.length){

        adminUsersList.innerHTML = `

            <div class="ah-empty">

                <i data-lucide="users"></i>

                <span>
                    هنوز کاربری ثبت نشده است
                </span>

            </div>

        `;

        lucide.createIcons();

        return;
    }


    users.forEach(
        (user,index)=>{

            const card =
                document.createElement("div");


            card.className =
                "ah-user-card";


            card.style.animationDelay =
                `${index * 40}ms`;


            card.innerHTML = `

                <!-- آواتار -->

                <div class="ah-user-avatar">

                    <i data-lucide="user-round"></i>

                </div>


                <!-- نام -->

                <div class="ah-user-column ah-name-column">

                    <span class="ah-column-label">
                        نام کاربر
                    </span>

                    <strong>
                        ${user.fullname || "بدون نام"}
                    </strong>

                </div>


                <!-- وضعیت -->

                <div class="ah-user-column ah-status-column">

                    <span class="ah-column-label">
                        وضعیت
                    </span>

                    <span
                        class="
                            ah-verify-badge
                            ${user.verified ? "verified" : "pending"}
                        "
                    >

                        <i
                            data-lucide="${
                                user.verified
                                    ? "badge-check"
                                    : "clock"
                            }"
                        ></i>

                        ${
                            user.verified
                                ? "تأیید شده"
                                : "در انتظار"
                        }

                    </span>

                </div>


                <!-- ایمیل -->

                <div class="ah-user-column ah-email-column">

                    <span class="ah-column-label">
                        ایمیل
                    </span>

                    <span class="ah-user-value">
                        ${user.email || "-"}
                    </span>

                </div>


                <!-- شماره تلفن -->

                <div class="ah-user-column ah-phone-column">

                    <span class="ah-column-label">
                        شماره تماس
                    </span>

                    <span class="ah-user-value">
                        ${user.phone || "-"}
                    </span>

                </div>


                <!-- شناسه ربات -->

                <div class="ah-user-column ah-chat-column">

                    <span class="ah-column-label">
                        شناسه ربات
                    </span>

                    <span class="ah-user-value">
                        ${user.chatId || "-"}
                    </span>

                </div>


                <!-- حذف -->

                <div class="ah-user-actions">

                    <button
                        class="ah-delete-btn"
                        data-id="${user._id}"
                        title="حذف کاربر"
                    >

                        <i data-lucide="trash-2"></i>

                    </button>

                </div>

            `;


            adminUsersList.appendChild(card);

        }
    );


    lucide.createIcons();


    document
        .querySelectorAll(".ah-delete-btn")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteUser(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}

// ======================================================
// ACTIVITY USERS
// ======================================================
// ======================================================
// ACTIVITY USERS
// ======================================================

function renderActivityUsers(users){

    recentActivityList.innerHTML = "";


    const activeUsers =
        users
            .filter(
                user =>
                    user.status !== "offline"
            )
            .slice(0,6);


    if(!activeUsers.length){

        recentActivityList.innerHTML = `

            <div class="ah-no-activity">

                <i data-lucide="moon"></i>

                <span>
                    کاربر فعالی وجود ندارد
                </span>

            </div>

        `;

        lucide.createIcons();

        return;
    }


    activeUsers.forEach(
        user => {

            const item =
                document.createElement("div");


            item.className =
                "ah-activity-user";


            item.innerHTML = `

                <!-- وضعیت آنلاین -->

                <div
                    class="
                        ah-status-dot
                        ${user.status}
                    "
                ></div>


                <!-- نام -->

                <div class="ah-activity-user-info">

                    <strong>
                        ${user.fullname || "بدون نام"}
                    </strong>

                    <span>
                        ${user.statusText}
                        ·
                        ${user.lastSeenAgo || "-"}
                    </span>

                </div>

            `;


            recentActivityList.appendChild(item);

        }
    );


    lucide.createIcons();

}

// ======================================================
// DELETE USER
// ======================================================

async function deleteUser(id){


    if(
        !confirm(
            "آیا از حذف این کاربر مطمئن هستید؟"
        )
    ){

        return;

    }



    try{


        const response =
            await fetch(
                `${ADMIN_API}/users/${id}`,
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "خطا در حذف کاربر"
            );

        }


        await loadUsers();

        await loadActivity();


    }
    catch(error){

        console.error(
            "DELETE USER ERROR:",
            error
        );


        alert(
            error.message ||
            "خطا در حذف کاربر"
        );

    }

}



// ======================================================
// REFRESH
// ======================================================

if(refreshUsersBtn){

    refreshUsersBtn.addEventListener(
        "click",
        async ()=>{

            refreshUsersBtn.classList.add(
                "loading"
            );


            await Promise.all([
                loadUsers(),
                loadActivity()
            ]);


            refreshUsersBtn.classList.remove(
                "loading"
            );

        }
    );

}



// ======================================================
// AUTO REFRESH
// ======================================================

setInterval(
    loadActivity,
    30000
);



// ======================================================
// START
// ======================================================

async function initAdmin(){

    await Promise.all([
        loadUsers(),
        loadActivity()
    ]);


    lucide.createIcons();

}


initAdmin();


</script>


<script>

if(
    typeof lucide !== "undefined"
){

    lucide.createIcons();

}

</script>


</body>

</html>
