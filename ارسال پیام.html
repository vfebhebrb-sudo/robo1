<script>
    // =====================================================
// ADMIN CHAT JS
// GAPGPT STYLE
// =====================================================


const API =
API_URL;

// =====================================================
// ELEMENTS
// =====================================================


const messages =
document.getElementById("messages");


const input =
document.getElementById("messageInput");


const sendBtn =
document.getElementById("sendBtn");


const emojiBtn =
document.getElementById("emojiBtn");


const emojiPicker =
document.getElementById("emojiPicker");


const attachBtn =
document.getElementById("attachBtn");


const fileInput =
document.getElementById("fileInput");


const selectedFile =
document.getElementById("selectedFile");


const selectedFileName =
document.getElementById("selectedFileName");


const selectedFileSize =
document.getElementById("selectedFileSize");


const removeFile =
document.getElementById("removeFile");



// =====================================================
// CURRENT USER
// =====================================================

const savedUser =
    localStorage.getItem("currentUser");


const currentUser =
    savedUser
    ? JSON.parse(savedUser)
    : null;


console.log(
    "🔥 CURRENT USER:",
    currentUser
);
// =====================================================
// STATE
// =====================================================


const chatId =
localStorage.getItem("adminChatId");



let selectedFileData=null;


let loadedMessages =
new Set();



let polling=null;





// =====================================================
// ESCAPE
// =====================================================


function escapeHTML(text){


const div =
document.createElement("div");


div.textContent=text || "";


return div.innerHTML;


}






// =====================================================
// FORMAT TIME
// =====================================================


function formatTime(date){


const d =
new Date(date || Date.now());


return (

String(d.getHours())
.padStart(2,"0")

+

":"

+

String(d.getMinutes())
.padStart(2,"0")

);


}






// =====================================================
// ADD MESSAGE
// =====================================================
function addMessage(
    text,
    type,
    time,
    sender="کاربر"
){

    const div = document.createElement("div");


let direction = "";

if(type === "admin"){
    direction = "outgoing";
}

if(type === "user"){
    direction = "incoming";
}

if(type === "ai"){
    direction = "incoming";
}


div.className = `message ${direction} ${type}`;


let icon = "user";

let name = sender;


// پیام دریافتی
if(type === "incoming"){

    icon = "user";
    name = sender;

}


// پیام خودم
if(type === "outgoing"){

    icon = "user";
    name = sender;

}


// پیام هوش مصنوعی
if(type === "ai"){

    icon = "bot";
    name = "هوش مصنوعی";

}



    div.innerHTML = `


    <div class="avatar-box">

        <i data-lucide="${icon}"></i>

    </div>



    <div class="message-wrapper">


        <span class="sender-name">
            ${name}
        </span>



        <div class="message-content">

            <p>
            ${escapeHTML(text)}
            </p>


            <span class="message-time">
            ${formatTime(time)}
            </span>


        </div>


    </div>


    `;



    messages.appendChild(div);



    if(window.lucide){

        lucide.createIcons();

    }



    messages.scrollTop =
    messages.scrollHeight;


}




// =====================================================
// LOAD MESSAGES
// =====================================================


async function loadMessages(){


if(!chatId)
return;



try{


const res =
await fetch(
`${API}/chat/messages/${chatId}`
);



const data =
await res.json();



const list =
data.messages || [];



list.forEach(msg=>{


if(
loadedMessages.has(msg._id)
)
return;



loadedMessages.add(msg._id);


let type = "incoming";


if(msg.senderType === "admin"){

    type = "outgoing";

}


if(msg.senderType === "ai"){

    type = "ai";

}



addMessage(

    msg.text,

    type,

    msg.createdAt,

    msg.senderName || msg.sender

);


});



}

catch(err){


console.log(
"LOAD MESSAGE ERROR",
err
);


}



}








// =====================================================
// SEND MESSAGE
// =====================================================


async function sendMessage(){


const text =
input.value.trim();



if(!text)
return;



// نمایش فوری


addMessage(
    text,
    "outgoing",
    new Date(),
    null,
    currentUser?.name || "کاربر",
    "user"
);


input.value="";




try{



const res =
await fetch(

`${API}/chat/message`,

{


method:"POST",


headers:{


"Content-Type":
"application/json"


},


body:JSON.stringify({

    chatId: chatId,

    sender:"مدیر",

    senderName:"مدیر برنامه کنکور",

    senderType:"admin",

    text:text

})


}

);



const data =
await res.json();


console.log(
"SEND:",
data
);



}


catch(e){


console.log(
"SEND ERROR",
e
);


}



}








// =====================================================
// BUTTON
// =====================================================


sendBtn.onclick =
sendMessage;



input.addEventListener(
"keydown",
e=>{


if(
e.key==="Enter"
){

sendMessage();

}


});








// =====================================================
// EMOJI
// =====================================================


emojiBtn.onclick =
e=>{


e.stopPropagation();


emojiPicker.classList.toggle(
"show"
);


};





emojiPicker.onclick =
e=>{


if(
e.target.tagName==="BUTTON"
){


input.value +=
e.target.innerText;


input.focus();



}



};




document.onclick =
()=>{


emojiPicker.classList.remove(
"show"
);


};









// =====================================================
// FILE SELECT
// =====================================================


attachBtn.onclick =
()=>{


fileInput.click();


};





fileInput.onchange =
()=>{


const file =
fileInput.files[0];


if(!file)
return;



selectedFileData=file;



selectedFileName.innerText =
file.name;



selectedFileSize.innerText =

(
file.size/1024
)
.toFixed(1)
+
" KB";



selectedFile.classList.add(
"show"
);



};






// REMOVE FILE


removeFile.onclick =
()=>{


selectedFileData=null;


fileInput.value="";


selectedFile.classList.remove(
"show"
);


};









// =====================================================
// POLLING
// =====================================================


function startPolling(){



if(polling)
clearInterval(polling);



polling =
setInterval(()=>{


loadMessages();



},2000);



}







// =====================================================
// START
// =====================================================


loadMessages();


startPolling();
</script>
